<body>
  <div class="wrap">
    <div class="header">
      <div class="title">Графік відключень — черга 1.1</div>
      <div class="controls">
        <label for="queueSelect" class="queue-label">Черга</label>
        <select id="queueSelect" class="queue-select" title="Вибрати чергу">
          <option>1.1</option><option>1.2</option>
          <option>2.1</option><option>2.2</option>
          <option>3.1</option><option>3.2</option>
          <option>4.1</option><option>4.2</option>
          <option>5.1</option><option>5.2</option>
          <option>6.1</option><option>6.2</option>
        </select>
        <button id="refreshBtn" title="Оновити зараз">🔄 Оновити</button>
        <span class="meta" id="updatedMeta">Останнє оновлення: —</span>
      </div>
    </div>

    <div class="card">
      <div class="legend">
        <span><span class="dot" style="background:var(--on-bg)"></span>Електрика є <span
            aria-hidden="true">⚡</span></span>
        <span><span class="dot" style="background:var(--off-bg)"></span>Відключено <span
            aria-hidden="true">🌑</span></span>
      </div>
      <div id="statusMsg" class="meta" style="margin-bottom:8px;"></div>
      <div id="errorMsg" class="error" style="display:none;"></div>
      <div id="grid" class="grid" aria-label="Сітка станів на 24 години"></div>
    </div>
    <p class="meta" style="margin-top:10px">
      Джерело: <code>https://gordovoy.net/blackout.php?queue=1.1</code>
      <span style="margin-left: 12px;">
          <a href="https://github.com/xainse/krop-electro-schedule" target="_blank" rel="noopener noreferrer">Версія:</a> <span id="version">—</span></a></span>
    </p>
    <div class="notification-status">
      <span id="notificationStatusText">Notifications: Checking...</span>
      <a href="#" id="requestNotificationLink" style="display:none;">Enable notifications</a>
    </div>
    <div class="donation-banner">
      <a href="https://bit.ly/49dS5cH" target="_blank" rel="noopener noreferrer">
        <img src="img/6797cbcba2d4e6545f20812f_spilnota_sternenka_simple logo.svg" alt="Spilnota" />
        <span>Допоможи 🇺🇦 Україні! Задонать на Русоріз!</span>
      </a>
    </div>
  </div>

  <script>
    // Версія коду - оновлюється після кожної зміни
    const VERSION = '1.14';
    
    const titleEl = document.querySelector('.title');
    const sourceCodeEl = document.querySelector('p.meta code');
    const queueSelect = document.getElementById('queueSelect');
    let currentQueue = localStorage.getItem('queue') || '1.1';
    queueSelect.value = currentQueue;
    let API_URL = `https://gordovoy.net/blackout.php?queue=${currentQueue}`;
    const gridEl = document.getElementById('grid');
    const updatedMeta = document.getElementById('updatedMeta');
    const errorMsg = document.getElementById('errorMsg');
    const statusMsg = document.getElementById('statusMsg');
    const refreshBtn = document.getElementById('refreshBtn');
    const versionEl = document.getElementById('version');
    const notificationStatusText = document.getElementById('notificationStatusText');
    const requestNotificationLink = document.getElementById('requestNotificationLink');
    
    // Зберігаємо попередній графік для порівняння
    let previousHours = null;

    // Малюємо 24 порожні клітинки одразу
    function initialGrid() {
      gridEl.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.h = h;
        cell.style.background = 'var(--unknown-bg)';
        cell.style.color = 'var(--unknown-fg)';
        cell.innerHTML = `<div class="hour">${String(h).padStart(2, '0')}:00</div>
                          <div class="emoji" aria-hidden="true">?</div>
                          <span class="sr-only">Невідомо</span>`;
        gridEl.appendChild(cell);
      }
    }

    // Допоміжне: з інтервалів робимо 24-годинний масив (true = є електрика, false = відключено)
    function hoursFromIntervals(intervals) {
      // За замовчуванням вважаємо, що електрика Є (true)
      const hours = Array(24).fill(true);
      const parseHM = s => {
        const [hh, mm] = s.split(':').map(n => parseInt(n, 10));
        return [isNaN(hh) ? 0 : hh, isNaN(mm) ? 0 : mm];
      };
      const overlapsHour = (start, end, h) => {
        // нормалізуємо в хвилини [0..1440), з урахуванням перетікання через північ
        const toMin = (hh, mm) => hh * 60 + mm;
        let [sh, sm] = parseHM(start);
        let [eh, em] = parseHM(end);
        let sMin = toMin(sh, sm);
        let eMin = toMin(eh, em);
        const hStart = h * 60, hEnd = (h + 1) * 60;
        if (eMin <= sMin) eMin += 1440; // через північ
        // перевіряємо перетин [sMin,eMin) з [hStart,hEnd) та з [hStart+1440,hEnd+1440)
        const intersect = (a1, a2, b1, b2) => Math.max(a1, b1) < Math.min(a2, b2);
        return intersect(sMin, eMin, hStart, hEnd) || intersect(sMin, eMin, hStart + 1440, hEnd + 1440);
      };
      for (const it of intervals) {
        const off = ('off' in it) ? !!it.off : (String(it.status || '').toLowerCase() === 'off' || String(it.type || '').toLowerCase().includes('off'));
        const on = ('on' in it) ? !!it.on : (String(it.status || '').toLowerCase() === 'on');
        const start = it.start || it.from || it.begin;
        const end = it.end || it.to || it.until;
        if (!start || !end) continue;
        for (let h = 0; h < 24; h++) {
          if (overlapsHour(start, end, h)) {
            if (off) hours[h] = false;
            else if (on) hours[h] = true;
          }
        }
      }
      return hours;
    }

    // Гнучкий парсер відповіді API → масив із 24 елементів: true (є), false (відключено), null (невідомо)
    function normalizeTo24(data) {
      // 1) Якщо є schedule з діапазонами годин (наприклад: "02-04, 06-08, 10-13")
      if (data?.schedule && typeof data.schedule === 'string') {
        statusMsg.textContent = 'Формат API: schedule з діапазонами годин';
        // За замовчуванням електрика є (true)
        const hours = Array(24).fill(true);
        
        // Розбиваємо рядок по комах і обробляємо кожен діапазон
        const ranges = data.schedule.split(',').map(s => s.trim()).filter(Boolean);
        
        for (const range of ranges) {
          // Шукаємо формат "HH-HH" (наприклад "02-04")
          const match = range.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})$/);
          if (match) {
            const start = parseInt(match[1], 10);
            const end = parseInt(match[2], 10);
            
            // Перевіряємо валідність (дозволяємо значення до 24 для обробки "22-24" як "22, 23")
            if (start >= 0 && start <= 24 && end >= 0 && end <= 24) {
              // Позначаємо всі години в діапазоні як відключені (false)
              // Діапазон: 02-04 означає години 2, 3 (не включаючи 4)
              // Використовуємо h < end для правильного парсингу
              for (let h = start; h < end && h < 24; h++) {
                hours[h] = false;
              }
            }
          }
        }
        
        return hours;
      }

      // 2) Якщо є масив із 24 значень
      const tryArrays = [
        data?.hours, data?.by_hour, data?.states, data?.status, data?.power, data?.electricity
      ].find(a => Array.isArray(a) && a.length === 24);
      if (tryArrays) {
        statusMsg.textContent = 'Формат API: 24-годинний масив';
        return tryArrays.map(v => {
          // Поширені випадки: 1/0, true/false, "on"/"off", "power"/"blackout"
          if (typeof v === 'boolean') return v;
          if (typeof v === 'number') return v > 0 ? false : true; // припущення: 1 = відключено
          const s = String(v).toLowerCase().trim();
          if (['on', 'power', 'yes', 'y', 'true', '1', 'green'].includes(s)) return true;
          if (['off', 'blackout', 'no', 'n', 'false', '0', 'red'].includes(s)) return false;
          return null;
        });
      }

      // 3) Якщо є перелік годин відключення (індекси 0..23 або "HH")
      const offList = data?.off_hours || data?.outage_hours || data?.blackout_hours;
      if (Array.isArray(offList)) {
        statusMsg.textContent = 'Формат API: список годин відключення';
        const set = new Set(offList.map(x => (typeof x === 'string' && x.includes(':')) ? parseInt(x.split(':')[0], 10) : parseInt(x, 10)));
        return Array.from({ length: 24 }, (_, h) => set.has(h) ? false : true);
      }

      // 4) Якщо інтервали
      const intervals = data?.intervals || data?.outages || data?.blackouts;
      if (Array.isArray(intervals) && intervals.length) {
        statusMsg.textContent = 'Формат API: інтервали часу';
        return hoursFromIntervals(intervals);
      }

      // 5) Якщо прийшов рядок "HH:MM-HH:MM; ..."
      if (typeof data === 'string') {
        statusMsg.textContent = 'Формат API: рядок інтервалів';
        const parts = data.split(/[;,]+/).map(s => s.trim()).filter(Boolean);
        const intervals = parts.map(p => {
          const m = p.match(/(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/);
          return m ? { start: m[1], end: m[2], off: true } : null;
        }).filter(Boolean);
        if (intervals.length) return hoursFromIntervals(intervals);
      }

      // Невідомий формат
      statusMsg.textContent = 'Невідомий формат відповіді API';
      return Array(24).fill(null);
    }

    function render(hours) {
      for (let h = 0; h < 24; h++) {
        const cell = gridEl.querySelector(`.cell[data-h="${h}"]`);
        if (!cell) continue;
        const val = hours[h];
        if (val === true) { // електрика є
          cell.style.background = 'var(--on-bg)';
          cell.style.color = 'var(--on-fg)';
          cell.querySelector('.emoji').textContent = '⚡';
          cell.querySelector('.sr-only')?.remove();
          cell.insertAdjacentHTML('beforeend', '<span class="sr-only">Є електрика</span>');
        } else if (val === false) { // відключено
          cell.style.background = 'var(--off-bg)';
          cell.style.color = 'var(--off-fg)';
          cell.querySelector('.emoji').textContent = '🌑';
          cell.querySelector('.sr-only')?.remove();
          cell.insertAdjacentHTML('beforeend', '<span class="sr-only">Відключено</span>');
        } else { // невідомо
          cell.style.background = 'var(--unknown-bg)';
          cell.style.color = 'var(--unknown-fg)';
          cell.querySelector('.emoji').textContent = '…';
          cell.querySelector('.sr-only')?.remove();
          cell.insertAdjacentHTML('beforeend', '<span class="sr-only">Невідомо</span>');
        }
      }
      // Оновлюємо виділення активної години після рендерингу
      updateActiveHour();
    }

    // Функція для оновлення виділення поточної години
    function updateActiveHour() {
      const now = new Date();
      const currentHour = now.getHours();
      
      // Прибираємо виділення з усіх клітинок
      const allCells = gridEl.querySelectorAll('.cell');
      allCells.forEach(cell => {
        cell.classList.remove('active');
      });
      
      // Додаємо виділення до поточної години
      const currentCell = gridEl.querySelector(`.cell[data-h="${currentHour}"]`);
      if (currentCell) {
        currentCell.classList.add('active');
      }
    }

    // Функція для запиту дозволу на нотифікації
    async function requestNotificationPermission() {
      if (!('Notification' in window)) return null;
      try {
        const permission = await Notification.requestPermission();
        localStorage.setItem('notificationPermission', permission);
        updateNotificationStatus();
        return permission;
      } catch (e) {
        console.warn('requestNotificationPermission failed:', e);
        return null;
      }
    }

    // Функція для оновлення статусу нотифікацій у футері
    function updateNotificationStatus() {
      if (!('Notification' in window)) {
        notificationStatusText.textContent = 'Notifications: Not supported';
        requestNotificationLink.style.display = 'none';
        return;
      }

      const permission = Notification.permission;
      localStorage.setItem('notificationPermission', permission);

      if (permission === 'granted') {
        notificationStatusText.textContent = 'Notifications: Enabled';
        requestNotificationLink.style.display = 'none';
      } else if (permission === 'denied') {
        notificationStatusText.textContent = 'Notifications: Disabled';
        requestNotificationLink.style.display = 'none';
      } else {
        notificationStatusText.textContent = 'Notifications: Disabled';
        requestNotificationLink.style.display = 'inline';
      }
    }

    // Функція для перевірки чи змінився графік
    function hasScheduleChanged(prev, current) {
      if (!prev) return false; // Перше завантаження - не показуємо
      return JSON.stringify(prev) !== JSON.stringify(current);
    }

    // Функція для показу нотифікації
    function showNotification(message) {
      // Guard against environments where Notification is not defined
      if (typeof Notification === 'undefined') return;
      try {
        if (Notification.permission === 'granted') {
          new Notification('Power Schedule', {
            body: message,
            icon: 'favicon.svg'
          });
        }
      } catch (e) {
        // Some browsers (or content blockers) might throw when creating notifications.
        // Don't let that break the app; log for diagnostics.
        console.warn('Notification failed:', e);
      }
    }

    // Функція для завантаження через CORS proxy (corsproxy.io)
    async function fetchWithProxy(url) {
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
      const res = await fetch(proxyUrl, { cache: 'no-store' });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}`);
      }
      return res;
    }

    async function load() {
      errorMsg.style.display = 'none';
      statusMsg.textContent = 'Завантаження…';
      try {
        // Використовуємо corsproxy.io для обходу CORS
        const res = await fetchWithProxy(API_URL);
        const text = await res.text();
        
        // Виводимо сиру відповідь в консоль
        console.log('=== Відповідь від API (сирий текст) ===');
        console.log(text);
        console.log('=== Кінець сирої відповіді ===\n');
        
        let data;
        try { 
          data = JSON.parse(text);
          console.log('=== Відповідь від API (розпарсений JSON) ===');
          console.log(data);
          console.log('=== Кінець JSON відповіді ===\n');
        } catch { 
          data = text;
          console.log('Відповідь не є JSON, використовується як текст');
        }
        
        // Обробляємо дані
        const hours = normalizeTo24(data);
        console.log('=== Результат normalizeTo24 (24 години) ===');
        console.log(hours);
        console.log('=== Кінець результату ===\n');
        
        // Перевіряємо чи змінився графік
        if (hasScheduleChanged(previousHours, hours)) {
          // Показуємо нотифікацію якщо графік змінився
          showNotification('Power schedule updated');
        }
        
        // Зберігаємо поточний графік як попередній
        previousHours = hours;
        
        render(hours);
        const ts = new Date();
        updatedMeta.textContent = 'Останнє оновлення: ' + ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        statusMsg.textContent = 'Готово';
      } catch (err) {
        const userMessage = 'Не вдалося отримати дані з API. ' + err.message;
        errorMsg.textContent = userMessage;
        errorMsg.style.display = 'block';
        statusMsg.textContent = 'Показано невідомі значення';
        render(Array(24).fill(null));
        console.error('Помилка завантаження даних:', err);
      }
    }

    // Ініціалізація
    versionEl.textContent = VERSION;
    initialGrid();
    updateActiveHour(); // Виділяємо поточну годину при завантаженні
    
    // Застосовуємо поточну чергу до заголовка та джерела
    function applyQueue() {
      API_URL = `https://gordovoy.net/blackout.php?queue=${currentQueue}`;
      if (sourceCodeEl) sourceCodeEl.textContent = API_URL;
      if (titleEl) titleEl.textContent = `Графік відключень — черга ${currentQueue}`;
      document.title = `Графік ${currentQueue} — 24 години`;
    }
    applyQueue();
    
    // Оновлюємо статус нотифікацій при завантаженні
    updateNotificationStatus();
    
    // Запитуємо дозвіл на нотифікації при завантаженні
    if ('Notification' in window && Notification.permission === 'default') {
      requestNotificationPermission();
    }
    
    load();

    // Кнопка «Оновити»
    refreshBtn.addEventListener('click', load);
    
    // Зміна черги
    queueSelect.addEventListener('change', () => {
      currentQueue = queueSelect.value;
      localStorage.setItem('queue', currentQueue);
      applyQueue();
      load();
    });

    // Обробник для посилання запиту дозволу на нотифікації
    requestNotificationLink.addEventListener('click', async (e) => {
      e.preventDefault();
      await requestNotificationPermission();
    });

    // Автоматичне оновлення виділення активної години (перевіряємо кожну хвилину)
    setInterval(updateActiveHour, 60 * 1000);

    // Автоматичне оновлення даних кожні 10 хвилин
    setInterval(load, 10 * 60 * 1000);
  </script>
</body>
