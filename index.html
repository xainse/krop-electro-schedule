  <script>
    // Версія коду - оновлюється після кожної зміни
    const VERSION = '1.27';
    
    const titleEl = document.querySelector('.title');
    const queueSelect = document.getElementById('queueSelect');
    const apiErrorMsg = document.getElementById('apiErrorMsg');
    const emergencyMsg = document.getElementById('emergencyMsg');
    let currentQueue = localStorage.getItem('queue') || '1.1';
    queueSelect.value = currentQueue;
    let API_URL = `https://xain.in.ua/api/blackout.php?queue=${currentQueue}`;
    const gridEl = document.getElementById('grid');
    const updatedMeta = document.getElementById('updatedMeta');
    const errorMsg = document.getElementById('errorMsg');
    const statusMsg = document.getElementById('statusMsg');
    const refreshBtn = document.getElementById('refreshBtn');
    const versionEl = document.getElementById('version');
    const notificationStatusText = document.getElementById('notificationStatusText');
    const requestNotificationLink = document.getElementById('requestNotificationLink');
    
    // Зберігаємо попередній графік для порівняння
    let previousHours = null;
    
    // Зберігаємо останні успішно завантажені дані та час оновлення
    let lastSuccessfulData = null;
    let lastSuccessfulTime = null;

    // Малюємо 24 порожні клітинки одразу
    function initialGrid() {
      gridEl.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.h = h;
        cell.style.background = 'var(--unknown-bg)';
        cell.style.color = 'var(--unknown-fg)';
        cell.innerHTML = `<div class="hour">${String(h).padStart(2, '0')}:00</div>
                          <div class="emoji" aria-hidden="true">?</div>
                          <span class="sr-only">Невідомо</span>`;
        gridEl.appendChild(cell);
      }
    }

    // Допоміжне: з інтервалів робимо 24-годинний масив (true = є електрика, false = відключено)
    function hoursFromIntervals(intervals) {
      // За замовчуванням вважаємо, що електрика Є (true)
      const hours = Array(24).fill(true);
      const parseHM = s => {
        const [hh, mm] = s.split(':').map(n => parseInt(n, 10));
        return [isNaN(hh) ? 0 : hh, isNaN(mm) ? 0 : mm];
      };
      const overlapsHour = (start, end, h) => {
        // нормалізуємо в хвилини [0..1440), з урахуванням перетікання через північ
        const toMin = (hh, mm) => hh * 60 + mm;
        let [sh, sm] = parseHM(start);
        let [eh, em] = parseHM(end);
        let sMin = toMin(sh, sm);
        let eMin = toMin(eh, em);
        const hStart = h * 60, hEnd = (h + 1) * 60;
        if (eMin <= sMin) eMin += 1440; // через північ
        // перевіряємо перетин [sMin,eMin) з [hStart,hEnd) та з [hStart+1440,hEnd+1440)
        const intersect = (a1, a2, b1, b2) => Math.max(a1, b1) < Math.min(a2, b2);
        return intersect(sMin, eMin, hStart, hEnd) || intersect(sMin, eMin, hStart + 1440, hEnd + 1440);
      };
      for (const it of intervals) {
        const off = ('off' in it) ? !!it.off : (String(it.status || '').toLowerCase() === 'off' || String(it.type || '').toLowerCase().includes('off'));
        const on = ('on' in it) ? !!it.on : (String(it.status || '').toLowerCase() === 'on');
        const start = it.start || it.from || it.begin;
        const end = it.end || it.to || it.until;
        if (!start || !end) continue;
        for (let h = 0; h < 24; h++) {
          if (overlapsHour(start, end, h)) {
            if (off) hours[h] = false;
            else if (on) hours[h] = true;
          }
        }
      }
      return hours;
    }

    // Парсер півгодинних періодів з формату "HH:MM-HH:MM"
    // Повертає масив з 48 елементів (кожен = 30 хвилин)
    function parseHalfHourSchedule(schedule) {
      // За замовчуванням електрика є (true) для всіх 48 півгодин
      const periods = Array(48).fill(true);
      
      // Розбиваємо рядок по комах і обробляємо кожен діапазон
      const ranges = schedule.split(',').map(s => s.trim()).filter(Boolean);
      
      for (const range of ranges) {
        // Шукаємо формат "HH:MM-HH:MM" (наприклад "06:00-08:00" або "10:00-11:30")
        const match = range.match(/^(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})$/);
        if (match) {
          const startHour = parseInt(match[1], 10);
          const startMin = parseInt(match[2], 10);
          const endHour = parseInt(match[3], 10);
          const endMin = parseInt(match[4], 10);
          
          // Конвертуємо час в хвилини від початку доби
          const startMinutes = startHour * 60 + startMin;
          const endMinutes = endHour * 60 + endMin;
          
          // Конвертуємо в індекси півгодин (кожен індекс = 30 хвилин)
          // Індекс 0 = 00:00-00:30, індекс 1 = 00:30-01:00, ...
          const startIndex = Math.floor(startMinutes / 30);
          const endIndex = Math.ceil(endMinutes / 30);
          
          // Позначаємо відключені періоди як false
          // Використовуємо Math.min(endIndex, 48) для обробки випадку 24:00
          for (let i = startIndex; i < Math.min(endIndex, 48); i++) {
            periods[i] = false;
          }
        } else {
          // Спробуємо старий формат "HH-HH" для сумісності
          const oldMatch = range.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})$/);
          if (oldMatch) {
            const start = parseInt(oldMatch[1], 10);
            const end = parseInt(oldMatch[2], 10);
            
            if (start >= 0 && start <= 24 && end >= 0 && end <= 24) {
              // Конвертуємо години в індекси півгодин
              const startIndex = start * 2;
              const endIndex = Math.min(end * 2, 48);
              
              for (let i = startIndex; i < endIndex; i++) {
                periods[i] = false;
              }
            }
          }
        }
      }
      
      return periods;
    }

    // Гнучкий парсер відповіді API → масив із 48 елементів (півгодинні періоди): true (є), false (відключено), null (невідомо)
    function normalizeTo24(data) {
      // 1) Якщо є schedule з діапазонами з хвилинами (наприклад: "06:00-08:00, 10:00-11:30")
      if (data?.schedule && typeof data.schedule === 'string') {
        // Перевіряємо чи є хвилини в форматі (наявність ":")
        if (data.schedule.includes(':')) {
          statusMsg.textContent = 'Формат API: schedule з півгодинними періодами';
          return parseHalfHourSchedule(data.schedule);
        }
        
        // Старий формат без хвилин (для сумісності)
        statusMsg.textContent = 'Формат API: schedule з діапазонами годин';
        // За замовчуванням електрика є (true)
        const hours = Array(24).fill(true);
        
        // Розбиваємо рядок по комах і обробляємо кожен діапазон
        const ranges = data.schedule.split(',').map(s => s.trim()).filter(Boolean);
        
        for (const range of ranges) {
          // Шукаємо формат "HH-HH" (наприклад "02-04")
          const match = range.match(/^(\d{1,2})\s*[-–]\s*(\d{1,2})$/);
          if (match) {
            const start = parseInt(match[1], 10);
            const end = parseInt(match[2], 10);
            
            // Перевіряємо валідність (дозволяємо значення до 24 для обробки "22-24" як "22, 23")
            if (start >= 0 && start <= 24 && end >= 0 && end <= 24) {
              // Позначаємо всі години в діапазоні як відключені (false)
              // Діапазон: 02-04 означає години 2, 3 (не включаючи 4)
              // Використовуємо h < end для правильного парсингу
              for (let h = start; h < end && h < 24; h++) {
                hours[h] = false;
              }
            }
          }
        }
        
        // Конвертуємо 24-годинний масив в 48 півгодинних (для сумісності)
        const periods = [];
        for (let h = 0; h < 24; h++) {
          periods.push(hours[h], hours[h]); // Кожна година = 2 півгодини з однаковим станом
        }
        return periods;
      }

      // Допоміжна функція для конвертації 24-годинного масиву в 48 півгодинних
      const convert24To48 = (hours24) => {
        const periods48 = [];
        for (let h = 0; h < 24; h++) {
          periods48.push(hours24[h], hours24[h]); // Кожна година = 2 півгодини з однаковим станом
        }
        return periods48;
      };

      // 2) Якщо є масив із 24 значень
      const tryArrays = [
        data?.hours, data?.by_hour, data?.states, data?.status, data?.power, data?.electricity
      ].find(a => Array.isArray(a) && a.length === 24);
      if (tryArrays) {
        statusMsg.textContent = 'Формат API: 24-годинний масив';
        const hours24 = tryArrays.map(v => {
          // Поширені випадки: 1/0, true/false, "on"/"off", "power"/"blackout"
          if (typeof v === 'boolean') return v;
          if (typeof v === 'number') return v > 0 ? false : true; // припущення: 1 = відключено
          const s = String(v).toLowerCase().trim();
          if (['on', 'power', 'yes', 'y', 'true', '1', 'green'].includes(s)) return true;
          if (['off', 'blackout', 'no', 'n', 'false', '0', 'red'].includes(s)) return false;
          return null;
        });
        return convert24To48(hours24);
      }

      // 3) Якщо є перелік годин відключення (індекси 0..23 або "HH")
      const offList = data?.off_hours || data?.outage_hours || data?.blackout_hours;
      if (Array.isArray(offList)) {
        statusMsg.textContent = 'Формат API: список годин відключення';
        const hours24 = Array.from({ length: 24 }, (_, h) => {
          const set = new Set(offList.map(x => (typeof x === 'string' && x.includes(':')) ? parseInt(x.split(':')[0], 10) : parseInt(x, 10)));
          return set.has(h) ? false : true;
        });
        return convert24To48(hours24);
      }

      // 4) Якщо інтервали
      const intervals = data?.intervals || data?.outages || data?.blackouts;
      if (Array.isArray(intervals) && intervals.length) {
        statusMsg.textContent = 'Формат API: інтервали часу';
        const hours24 = hoursFromIntervals(intervals);
        return convert24To48(hours24);
      }

      // 5) Якщо прийшов рядок "HH:MM-HH:MM; ..."
      if (typeof data === 'string') {
        statusMsg.textContent = 'Формат API: рядок інтервалів';
        const parts = data.split(/[;,]+/).map(s => s.trim()).filter(Boolean);
        const intervals = parts.map(p => {
          const m = p.match(/(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/);
          return m ? { start: m[1], end: m[2], off: true } : null;
        }).filter(Boolean);
        if (intervals.length) {
          const hours24 = hoursFromIntervals(intervals);
          return convert24To48(hours24);
        }
      }

      // Невідомий формат
      statusMsg.textContent = 'Невідомий формат відповіді API';
      return Array(48).fill(null);
    }

    function render(periods) {
      // periods - масив з 48 елементів (півгодинні періоди)
      for (let h = 0; h < 24; h++) {
        const cell = gridEl.querySelector(`.cell[data-h="${h}"]`);
        if (!cell) continue;
        
        // Отримуємо два півгодинні періоди для цієї години
        const firstHalf = periods[h * 2];     // Перша півгодина (HH:00-HH:30)
        const secondHalf = periods[h * 2 + 1]; // Друга півгодина (HH:30-HH+1:00)
        
        // Видаляємо попередні класи півгодин та білого тексту
        cell.classList.remove('half-left-off', 'half-right-off', 'has-white-text');
        
        // Визначаємо стан клітинки на основі двох півгодин
        if (firstHalf === true && secondHalf === true) {
          // Обидва періоди true → повністю жовта
          cell.style.background = 'var(--on-bg)';
          cell.style.color = 'var(--on-fg)';
          cell.querySelector('.emoji').textContent = '⚡';
          cell.querySelector('.sr-only')?.remove();
          cell.insertAdjacentHTML('beforeend', '<span class="sr-only">Є електрика</span>');
        } else if (firstHalf === false && secondHalf === false) {
          // Обидва періоди false → повністю темно-сіра
          cell.style.background = 'var(--off-bg)';
          cell.style.color = 'var(--off-fg)';
          cell.classList.add('has-white-text'); // Додаємо клас для тіні на білому тексті
          cell.querySelector('.emoji').textContent = '🌑';
          cell.querySelector('.sr-only')?.remove();
          cell.insertAdjacentHTML('beforeend', '<span class="sr-only">Відключено</span>');
        } else if (firstHalf === false && secondHalf === true) {
          // Перший false, другий true → ліва половина темно-сіра, права жовта
          cell.style.background = 'linear-gradient(to right, var(--off-bg) 50%, var(--on-bg) 50%)';
          cell.style.color = 'var(--off-fg)';
          cell.classList.add('half-left-off', 'has-white-text'); // Додаємо клас для тіні на білому тексті
          cell.querySelector('.emoji').textContent = '🌑⚡';
          cell.querySelector('.sr-only')?.remove();
          cell.insertAdjacentHTML('beforeend', '<span class="sr-only">Відключено першу півгодину</span>');
        } else if (firstHalf === true && secondHalf === false) {
          // Перший true, другий false → ліва половина жовта, права темно-сіра
          cell.style.background = 'linear-gradient(to right, var(--on-bg) 50%, var(--off-bg) 50%)';
          cell.style.color = 'var(--on-fg)';
          cell.classList.add('half-right-off');
          cell.querySelector('.emoji').textContent = '⚡🌑';
          cell.querySelector('.sr-only')?.remove();
          cell.insertAdjacentHTML('beforeend', '<span class="sr-only">Відключено другу півгодину</span>');
        } else {
          // Невідомо (якщо один з періодів null)
          cell.style.background = 'var(--unknown-bg)';
          cell.style.color = 'var(--unknown-fg)';
          cell.querySelector('.emoji').textContent = '…';
          cell.querySelector('.sr-only')?.remove();
          cell.insertAdjacentHTML('beforeend', '<span class="sr-only">Невідомо</span>');
        }
      }
      // Оновлюємо виділення активної години після рендерингу
      updateActiveHour();
    }

    // Функція для оновлення виділення поточної години
    function updateActiveHour() {
      const now = new Date();
      const currentHour = now.getHours();
      
      // Прибираємо виділення з усіх клітинок
      const allCells = gridEl.querySelectorAll('.cell');
      allCells.forEach(cell => {
        cell.classList.remove('active');
      });
      
      // Додаємо виділення до поточної години
      const currentCell = gridEl.querySelector(`.cell[data-h="${currentHour}"]`);
      if (currentCell) {
        currentCell.classList.add('active');
      }
    }

    // Функція для запиту дозволу на нотифікації
    async function requestNotificationPermission() {
      if (!('Notification' in window)) return null;
      try {
        const permission = await Notification.requestPermission();
        localStorage.setItem('notificationPermission', permission);
        updateNotificationStatus();
        return permission;
      } catch (e) {
        console.warn('requestNotificationPermission failed:', e);
        return null;
      }
    }

    // Функція для оновлення статусу нотифікацій у футері
    function updateNotificationStatus() {
      if (!('Notification' in window)) {
        notificationStatusText.textContent = 'Notifications: Not supported';
        requestNotificationLink.style.display = 'none';
        return;
      }

      const permission = Notification.permission;
      localStorage.setItem('notificationPermission', permission);

      if (permission === 'granted') {
        notificationStatusText.textContent = 'Notifications: Enabled';
        requestNotificationLink.style.display = 'none';
      } else if (permission === 'denied') {
        notificationStatusText.textContent = 'Notifications: Disabled';
        requestNotificationLink.style.display = 'none';
      } else {
        notificationStatusText.textContent = 'Notifications: Disabled';
        requestNotificationLink.style.display = 'inline';
      }
    }

    // Функція для перевірки чи змінився графік
    function hasScheduleChanged(prev, current) {
      if (!prev) return false; // Перше завантаження - не показуємо
      return JSON.stringify(prev) !== JSON.stringify(current);
    }

    // Функція для показу нотифікації
    function showNotification(message) {
      // Guard against environments where Notification is not defined
      if (typeof Notification === 'undefined') return;
      try {
        if (Notification.permission === 'granted') {
          new Notification('Power Schedule', {
            body: message,
            icon: 'favicon.svg'
          });
        }
      } catch (e) {
        // Some browsers (or content blockers) might throw when creating notifications.
        // Don't let that break the app; log for diagnostics.
        console.warn('Notification failed:', e);
      }
    }

    async function load() {
      errorMsg.style.display = 'none';
      emergencyMsg.style.display = 'none';
      // Не приховуємо apiErrorMsg тут, щоб зберегти повідомлення про застарілі дані під час завантаження
      statusMsg.textContent = 'Завантаження…';
      try {
        // Викликаємо API напряму (без proxy)
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} ${res.statusText}`);
        }
        const text = await res.text();
        
        // Виводимо сиру відповідь в консоль
        console.log('=== Відповідь від API (сирий текст) ===');
        console.log(text);
        console.log('=== Кінець сирої відповіді ===\n');
        
        let data;
        try { 
          data = JSON.parse(text);
          console.log('=== Відповідь від API (розпарсений JSON) ===');
          console.log(data);
          console.log('=== Кінець JSON відповіді ===\n');
          
          // Перевіряємо чи є помилка в відповіді API
          if (data.success === false && data.error) {
            // Якщо є помилка в відповіді API, але є збережені дані - показуємо їх
            if (lastSuccessfulData !== null) {
              render(lastSuccessfulData);
              const timeStr = lastSuccessfulTime ? lastSuccessfulTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
              apiErrorMsg.style.display = 'none'; // Приховуємо повідомлення про помилку
              updatedMeta.textContent = 'Останнє оновлення: ' + timeStr + ' (⚠️ застарілі)';
              updatedMeta.style.color = '#dc2626';
              statusMsg.textContent = 'Показано останні доступні дані';
              return; // Виходимо, не оновлюючи дані
            } else {
              apiErrorMsg.textContent = data.error;
              apiErrorMsg.style.display = 'block';
            }
          } else {
            apiErrorMsg.style.display = 'none';
            // Повертаємо нормальний колір для updatedMeta при успішному оновленні
            updatedMeta.style.color = '';
          }
          
          // Перевіряємо чи є активний графік аварійних відключень (ГАВ)
          // Перевіряємо як boolean true, так і рядок "true" для сумісності
          console.log('=== Перевірка emergency_mode ===');
          console.log('emergency_mode:', data.emergency_mode);
          console.log('Тип:', typeof data.emergency_mode);
          if (data.emergency_mode === true || data.emergency_mode === 'true' || data.emergency_mode === 1) {
            console.log('ГАВ активний - показуємо повідомлення');
            emergencyMsg.textContent = '⚠️ Увага! На даний час діє графік аварійних відключень (ГАВ). Час відключення невідомий.';
            emergencyMsg.style.display = 'block';
          } else {
            console.log('ГАВ неактивний - приховуємо повідомлення');
            emergencyMsg.style.display = 'none';
          }
          console.log('=== Кінець перевірки emergency_mode ===\n');
        } catch (parseErr) { 
          // Якщо не вдалося розпарсити JSON, але є збережені дані - показуємо їх
          if (lastSuccessfulData !== null) {
            render(lastSuccessfulData);
            const timeStr = lastSuccessfulTime ? lastSuccessfulTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
            apiErrorMsg.style.display = 'none'; // Приховуємо повідомлення про помилку
            updatedMeta.textContent = 'Останнє оновлення: ' + timeStr + ' (⚠️ застарілі)';
            updatedMeta.style.color = '#dc2626';
            statusMsg.textContent = 'Показано останні доступні дані';
            return; // Виходимо, не оновлюючи дані
          }
          data = text;
          console.log('Відповідь не є JSON, використовується як текст');
        }
        
        // Обробляємо дані
        const periods = normalizeTo24(data);
        console.log('=== Результат normalizeTo24 (48 півгодинних періодів) ===');
        console.log(periods);
        console.log('=== Кінець результату ===\n');
        
        // Перевіряємо чи змінився графік
        if (hasScheduleChanged(previousHours, periods)) {
          // Показуємо нотифікацію якщо графік змінився
          showNotification('Power schedule updated');
        }
        
        // Зберігаємо поточний графік як попередній
        previousHours = periods;
        
        render(periods);
        const ts = new Date();
        updatedMeta.textContent = 'Останнє оновлення: ' + ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        // Повертаємо нормальний колір для updatedMeta при успішному оновленні
        updatedMeta.style.color = '';
        statusMsg.textContent = 'Готово';
        
        // Зберігаємо успішно завантажені дані
        lastSuccessfulData = periods;
        lastSuccessfulTime = ts;
        
        // Зберігаємо дані в localStorage для використання при перезавантаженні
        try {
          localStorage.setItem('lastSuccessfulData', JSON.stringify(periods));
          localStorage.setItem('lastSuccessfulTime', ts.toISOString());
        } catch (e) {
          console.warn('Не вдалося зберегти дані в localStorage:', e);
        }
        
        // Приховуємо повідомлення про застарілі дані, якщо воно було показано
        apiErrorMsg.style.display = 'none';
      } catch (err) {
        console.error('Помилка завантаження даних:', err);
        
        // Якщо є збережені дані - показуємо їх замість невідомих значень
        if (lastSuccessfulData !== null) {
          render(lastSuccessfulData);
          
          // Оновлюємо текст останнього оновлення з індикацією застарілості
          const timeStr = lastSuccessfulTime ? lastSuccessfulTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
          apiErrorMsg.style.display = 'none'; // Приховуємо повідомлення про помилку
          updatedMeta.textContent = 'Останнє оновлення: ' + timeStr + ' (⚠️ застарілі)';
          updatedMeta.style.color = '#dc2626';
          
          statusMsg.textContent = 'Показано останні доступні дані';
        } else {
          // Якщо немає збережених даних - показуємо помилку як раніше
          const userMessage = 'Не вдалося отримати дані з API. ' + err.message;
          errorMsg.textContent = userMessage;
          errorMsg.style.display = 'block';
          statusMsg.textContent = 'Показано невідомі значення';
          render(Array(48).fill(null));
        }
      }
    }

    // Ініціалізація
    versionEl.textContent = VERSION;
    initialGrid();
    updateActiveHour(); // Виділяємо поточну годину при завантаженні
    
    // Завантажуємо збережені дані з localStorage при ініціалізації
    try {
      const savedData = localStorage.getItem('lastSuccessfulData');
      const savedTime = localStorage.getItem('lastSuccessfulTime');
      if (savedData) {
        lastSuccessfulData = JSON.parse(savedData);
        if (savedTime) {
          lastSuccessfulTime = new Date(savedTime);
          // Відображаємо збережені дані одразу, якщо вони є
          render(lastSuccessfulData);
          const timeStr = lastSuccessfulTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          updatedMeta.textContent = 'Останнє оновлення: ' + timeStr + ' (завантажується...)';
        }
      }
    } catch (e) {
      console.warn('Не вдалося завантажити дані з localStorage:', e);
    }
    
    // Застосовуємо поточну чергу до заголовка
    function applyQueue() {
      API_URL = `https://xain.in.ua/api/blackout.php?queue=${currentQueue}`;
      if (titleEl) titleEl.textContent = `Графік відключень — черга ${currentQueue}`;
      document.title = `Графік ${currentQueue} — 24 години`;
    }
    applyQueue();
    
    // Оновлюємо статус нотифікацій при завантаженні
    updateNotificationStatus();
    
    // Запитуємо дозвіл на нотифікації при завантаженні
    if ('Notification' in window && Notification.permission === 'default') {
      requestNotificationPermission();
    }
    
    load();

    // Кнопка «Оновити»
    refreshBtn.addEventListener('click', load);
    
    // Зміна черги
    queueSelect.addEventListener('change', () => {
      currentQueue = queueSelect.value;
      localStorage.setItem('queue', currentQueue);
      applyQueue();
      load();
    });

    // Обробник для посилання запиту дозволу на нотифікації
    requestNotificationLink.addEventListener('click', async (e) => {
      e.preventDefault();
      await requestNotificationPermission();
    });

    // Автоматичне оновлення виділення активної години (перевіряємо кожну хвилину)
    setInterval(updateActiveHour, 60 * 1000);

    // Автоматичне оновлення даних кожні 10 хвилин
    setInterval(load, 10 * 60 * 1000);
  </script>
</body>
