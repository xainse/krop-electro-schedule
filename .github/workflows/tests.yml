name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-secrets.py
      - run: python3 -m unittest discover -s tests/deploy -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - run: node scripts/update-csp.js --check
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          extensions: dom, mbstring, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-plugins --no-scripts
        working-directory: tests/backend
      - run: vendor/bin/phpunit
        working-directory: tests/backend
      - run: npm ci --ignore-scripts
        working-directory: tests/frontend
      - run: npm test -- --runInBand
        working-directory: tests/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: tests/frontend
      - run: npm run test:e2e
        working-directory: tests/frontend
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.3'
          coverage: none
      - name: Audit npm including test dependencies
        id: npm-audit
        run: npm audit --audit-level=moderate
        working-directory: tests/frontend
      - name: Audit Composer including test dependencies
        if: ${{ !cancelled() }}
        run: composer audit --locked --no-interaction
        working-directory: tests/backend
  publish:
    needs: [verify, dependencies]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage public frontend files only
        run: |
          mkdir -p "$RUNNER_TEMP/krop-pages"
          cp index.html styles.css favicon.svg preview.png "$RUNNER_TEMP/krop-pages/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0; nested upload-artifact also SHA-pinned
        with:
          path: ${{ runner.temp }}/krop-pages
      - name: Deploy verified frontend
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
